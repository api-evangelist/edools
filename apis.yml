aid: edools
name: Edools
description: >-
  Edools is a Brazilian e-learning and digital-education platform for creating,
  hosting, and selling online courses, learning paths, and training programs
  under a white-label school (LMS) with a Netflix-style members area, video
  hosting, and student engagement tools. The platform is now delivered as
  HeroSpark (edools.com redirects to herospark.com), a digital-product sales
  suite for course creators covering checkout, payments (SparkPay), members
  areas, and a student mobile app. Edools exposes a token-authenticated REST
  API (base host per-school on myedools.com) for team, content, and student
  management, plus first-party Ruby and PHP client libraries and theme
  development tooling, letting integrators sync courses, students, enrollments,
  and school products with external systems.
